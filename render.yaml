# Configuración para Render (Blueprint). Los valores secretos se escriben en
# el panel de Render, nunca aquí.
services:
  - type: web
    name: spring-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_ENABLED
        value: "true"
