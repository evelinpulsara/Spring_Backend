spring.application.name=spring-backend
server.port=${PORT:8080}

# Lee variables desde un archivo .env local (opcional, NO se sube a GitHub).
spring.config.import=optional:file:.env[.properties]

# ── Base de datos ───────────────────────────────────────────────────────────
# Sin DB_URL: base local en el archivo ./data/spring-db (para probar en tu compu).
# Con DB_URL: PostgreSQL de Supabase (producción). Ver README.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/spring-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Flyway crea y actualiza las tablas (src/main/resources/db/migration).
spring.flyway.enabled=true
# Hibernate solo comprueba que las tablas coincidan; nunca las borra.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Sesión (JWT) ────────────────────────────────────────────────────────────
# En producción define JWT_SECRET (mínimo 32 caracteres, secreto).
app.jwt.secret=${JWT_SECRET:solo-para-desarrollo-cambia-este-secreto-en-produccion}
app.jwt.duration=${JWT_DURATION:7d}

# Cuenta de prueba demo@spring.app (contraseña Spring1234) con datos de ejemplo.
app.demo.enabled=${DEMO_ENABLED:true}

# ── Gemini (Asistente Spring) ───────────────────────────────────────────────
# La clave se obtiene gratis en https://aistudio.google.com/apikey
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
