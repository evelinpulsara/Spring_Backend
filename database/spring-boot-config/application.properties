# =============================================================================
# Spring - Configuración Spring Boot + PostgreSQL
# ARCHIVO: src/main/resources/application.properties
# =============================================================================

# ── Aplicación ──────────────────────────────────────────────────────────────
spring.application.name=spring_calendario-api
server.port=8080

# ── Base de datos PostgreSQL ─────────────────────────────────────────────────
# Reemplaza con tus credenciales reales (usa variables de entorno en producción)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spring_calendario_db}
spring.datasource.username=${DB_USERNAME:spring_calendario_user}
spring.datasource.password=${DB_PASSWORD:tu_contrasena_segura}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── Spring Data JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
# IMPORTANTE: usa "validate" en producción, "none" si manejas migraciones con Flyway
# NUNCA uses "create" o "create-drop" en producción (borra datos)

