# =============================================================================
# Spring - Configuración Spring Boot + PostgreSQL
# ARCHIVO: src/main/resources/application.properties
# =============================================================================

# ── Aplicación ──────────────────────────────────────────────────────────────
spring.application.name=spring_calendario-api
server.port=8080

# ── Base de datos PostgreSQL ─────────────────────────────────────────────────
# Reemplaza con tus credenciales reales (usa variables de entorno en producción)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spring_calendario_db}
spring.datasource.username=${DB_USERNAME:spring_calendario_user}
spring.datasource.password=${DB_PASSWORD:tu_contrasena_segura}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── Spring Data JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
# IMPORTANTE: usa "validate" en producción, "none" si manejas migraciones con Flyway
# NUNCA uses "create" o "create-drop" en producción (borra datos)

spring.jpa.show-sql=false
# Cambia a true solo para depurar en desarrollo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway (migraciones de base de datos) ────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Spring Security / JWT ────────────────────────────────────────────────────
# Secreto JWT: usa mínimo 256 bits (32 chars). CAMBIA ESTE VALOR.
jwt.secret=${JWT_SECRET:cambia-este-secreto-en-produccion-minimo-256-bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# 86400000 ms = 24 horas

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.spring_calendario=INFO
logging.level.org.springframework.security=WARN

# ── Gestión de errores ────────────────────────────────────────────────────────
server.error.include-message=never
server.error.include-stacktrace=never
# Por seguridad: nunca expongas stack traces en producción
